name: Build Android APK

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL compiled into the app"
        required: true
        default: "http://10.0.2.2:3000/api/v1"

env:
  FLUTTER_VERSION: "3.32.0"

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=android .

      - run: flutter pub get

      - name: Allow cleartext HTTP
        run: |
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' \
            android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'http://10.0.2.2:3000/api/v1' }}

      - uses: actions/upload-artifact@v4
        with:
          name: twr-crm-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
